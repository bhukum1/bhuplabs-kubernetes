apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-chatbot-config
  namespace: default
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /api/chat {
        proxy_pass https://n8n.bhuplabs.dev/webhook/chatbot;
        proxy_ssl_server_name on;
        proxy_ssl_name n8n.bhuplabs.dev;
        proxy_set_header Host n8n.bhuplabs.dev;
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <meta name="theme-color" content="#07111f">
      <title>Bhuplabs AI Assistant</title>
      <style>
        :root {
          color-scheme: dark;
          --bg: #07111f;
          --panel: rgba(12, 27, 45, .82);
          --line: rgba(148, 163, 184, .16);
          --muted: #94a3b8;
          --text: #e8f0fa;
          --cyan: #28d7c0;
          --blue: #3b82f6;
          --danger: #fb7185;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100dvh;
          overflow: hidden;
          font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: var(--text);
          background:
            radial-gradient(circle at 15% 15%, rgba(40, 215, 192, .14), transparent 28rem),
            radial-gradient(circle at 88% 82%, rgba(59, 130, 246, .18), transparent 32rem),
            var(--bg);
        }
        body::before {
          content: "";
          position: fixed;
          inset: 0;
          pointer-events: none;
          opacity: .2;
          background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
          background-size: 32px 32px;
          mask-image: linear-gradient(to bottom, black, transparent);
        }
        .shell {
          position: relative;
          display: grid;
          grid-template-rows: auto 1fr auto;
          width: min(920px, calc(100% - 28px));
          height: min(820px, calc(100dvh - 28px));
          margin: 14px auto;
          background: var(--panel);
          border: 1px solid var(--line);
          border-radius: 24px;
          box-shadow: 0 30px 90px rgba(0, 0, 0, .36);
          backdrop-filter: blur(20px);
          overflow: hidden;
        }
        header {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 18px 22px;
          border-bottom: 1px solid var(--line);
        }
        .mark {
          display: grid;
          place-items: center;
          width: 44px;
          height: 44px;
          border-radius: 14px;
          color: #06101d;
          font-weight: 900;
          background: linear-gradient(135deg, var(--cyan), #7dd3fc);
          box-shadow: 0 0 35px rgba(40, 215, 192, .23);
        }
        h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
        .status { margin-top: 2px; color: var(--muted); font-size: 12px; }
        .dot {
          display: inline-block;
          width: 7px;
          height: 7px;
          margin-right: 6px;
          border-radius: 50%;
          background: var(--cyan);
          box-shadow: 0 0 12px var(--cyan);
        }
        .messages {
          overflow-y: auto;
          scroll-behavior: smooth;
          padding: 28px clamp(16px, 4vw, 44px);
        }
        .message {
          display: flex;
          gap: 11px;
          max-width: 78%;
          margin: 0 0 20px;
          animation: rise .2s ease-out;
        }
        .message.user { margin-left: auto; flex-direction: row-reverse; }
        .avatar {
          flex: 0 0 30px;
          display: grid;
          place-items: center;
          width: 30px;
          height: 30px;
          border-radius: 10px;
          background: rgba(40, 215, 192, .13);
          color: var(--cyan);
          font-size: 12px;
          font-weight: 800;
        }
        .user .avatar { color: #bfdbfe; background: rgba(59, 130, 246, .18); }
        .bubble {
          padding: 12px 15px;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          border: 1px solid var(--line);
          border-radius: 5px 16px 16px;
          background: rgba(20, 38, 59, .76);
        }
        .user .bubble {
          border-color: rgba(59, 130, 246, .23);
          border-radius: 16px 5px 16px 16px;
          background: linear-gradient(135deg, rgba(37, 99, 235, .92), rgba(29, 78, 216, .75));
        }
        .error .bubble { color: #fecdd3; border-color: rgba(251,113,133,.3); }
        .typing .bubble { color: var(--muted); }
        .typing .bubble span { animation: blink 1.1s infinite; }
        .typing .bubble span:nth-child(2) { animation-delay: .15s; }
        .typing .bubble span:nth-child(3) { animation-delay: .3s; }
        form {
          display: flex;
          gap: 10px;
          margin: 0 clamp(14px, 3vw, 28px) 22px;
          padding: 10px 10px 10px 17px;
          border: 1px solid var(--line);
          border-radius: 17px;
          background: rgba(4, 13, 25, .62);
          box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
        }
        textarea {
          flex: 1;
          min-height: 26px;
          max-height: 130px;
          resize: none;
          border: 0;
          outline: 0;
          padding: 7px 0;
          color: var(--text);
          background: transparent;
          font: inherit;
        }
        textarea::placeholder { color: #64748b; }
        button {
          align-self: flex-end;
          width: 42px;
          height: 42px;
          border: 0;
          border-radius: 13px;
          color: #04121c;
          background: linear-gradient(135deg, var(--cyan), #7dd3fc);
          cursor: pointer;
          transition: transform .15s, opacity .15s;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { cursor: wait; opacity: .45; transform: none; }
        .send-icon { width: 18px; height: 18px; vertical-align: middle; }
        @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
        @keyframes blink { 50% { opacity: .2; } }
        @media (max-width: 640px) {
          .shell { width: 100%; height: 100dvh; margin: 0; border: 0; border-radius: 0; }
          .message { max-width: 90%; }
          header { padding: 14px 16px; }
        }
      </style>
    </head>
    <body>
      <main class="shell">
        <header>
          <div class="mark">B</div>
          <div>
            <h1>Bhuplabs AI Assistant</h1>
            <div class="status"><span class="dot"></span>Connected via n8n</div>
          </div>
        </header>
        <section id="messages" class="messages" aria-live="polite">
          <div class="message">
            <div class="avatar">AI</div>
            <div class="bubble">Hello! How can I help you today?</div>
          </div>
        </section>
        <form id="chat-form">
          <textarea id="input" rows="1" placeholder="Ask me anything…" aria-label="Message" required></textarea>
          <button id="send" type="submit" aria-label="Send message">
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
            </svg>
          </button>
        </form>
      </main>
      <script>
        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#input");
        const send = document.querySelector("#send");
        const messages = document.querySelector("#messages");
        function createSessionId() {
          if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
          if (globalThis.crypto?.getRandomValues) {
            const bytes = new Uint8Array(16);
            globalThis.crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          }
          return `chat-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        const sessionId = localStorage.getItem("bhuplabs-chat-session") || createSessionId();
        localStorage.setItem("bhuplabs-chat-session", sessionId);

        function addMessage(text, role = "assistant", extra = "") {
          const row = document.createElement("div");
          row.className = `message ${role === "user" ? "user" : ""} ${extra}`;
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = role === "user" ? "YOU" : "AI";
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = text;
          row.append(avatar, bubble);
          messages.append(row);
          messages.scrollTop = messages.scrollHeight;
          return row;
        }

        function extractReply(data) {
          const value = Array.isArray(data) ? data[0] : data;
          if (typeof value === "string") return value;
          return value?.output ?? value?.text ?? value?.message ??
            value?.response ?? value?.data?.output ?? JSON.stringify(value);
        }

        input.addEventListener("input", () => {
          input.style.height = "auto";
          input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
        });
        input.addEventListener("keydown", event => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
          }
        });

        form.addEventListener("submit", async event => {
          event.preventDefault();
          const chatInput = input.value.trim();
          if (!chatInput || send.disabled) return;
          addMessage(chatInput, "user");
          input.value = "";
          input.style.height = "auto";
          send.disabled = true;
          const typing = addMessage("•••", "assistant", "typing");
          typing.querySelector(".bubble").innerHTML = "<span>●</span> <span>●</span> <span>●</span>";
          try {
            const response = await fetch("/api/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "sendMessage", sessionId, chatInput })
            });
            if (!response.ok) throw new Error(`Webhook returned HTTP ${response.status}`);
            const type = response.headers.get("content-type") || "";
            const raw = await response.text();
            const data = type.includes("application/json") && raw ? JSON.parse(raw) : raw;
            typing.remove();
            addMessage(extractReply(data) || "Your message was delivered successfully.");
          } catch (error) {
            typing.remove();
            addMessage(`I couldn't reach the workflow. ${error.message}`, "assistant", "error");
          } finally {
            send.disabled = false;
            input.focus();
          }
        });
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-chatbot
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-chatbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-chatbot
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: content
          configMap:
            name: nginx-chatbot-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-chatbot
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-chatbot
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx-chatbot
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
