apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-oauth2-proxy-vault
  namespace: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-oauth2-proxy
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n-oauth2-proxy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-oauth2-proxy
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-requests-cpu: "20m"
        vault.hashicorp.com/role: n8n-oauth2-proxy
        vault.hashicorp.com/service: http://vault-active.vault.svc:8200
        vault.hashicorp.com/agent-inject-secret-client-secret: secret/data/keycloak/clients/n8n-proxy
        vault.hashicorp.com/agent-inject-template-client-secret: |-
          {{- with secret "secret/data/keycloak/clients/n8n-proxy" -}}
          {{ .Data.data.client_secret }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-cookie-secret: secret/data/keycloak/clients/n8n-proxy
        vault.hashicorp.com/agent-inject-template-cookie-secret: |-
          {{- with secret "secret/data/keycloak/clients/n8n-proxy" -}}
          {{ .Data.data.cookie_secret_b64 | base64Decode }}
          {{- end }}
    spec:
      serviceAccountName: n8n-oauth2-proxy-vault
      nodeSelector:
        kubernetes.io/hostname: node01
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.bhuplabs.dev/realms/master
            - --client-id=n8n-proxy
            - --client-secret-file=/vault/secrets/client-secret
            - --cookie-secret-file=/vault/secrets/cookie-secret
            - --redirect-url=https://n8n.bhuplabs.dev/oauth2/callback
            - --email-domain=*
            - --scope=openid profile email
            - --upstream=http://n8n.n8n.svc.cluster.local:5678
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.244.0.0/16
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_bhuplabs_n8n_sso
            - --cookie-refresh=5m
            - --cookie-expire=8h
            - --code-challenge-method=S256
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-oauth2-proxy
  namespace: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
