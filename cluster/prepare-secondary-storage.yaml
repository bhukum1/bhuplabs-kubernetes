apiVersion: v1
kind: Pod
metadata:
  name: production-storage-prep-node01
  namespace: kube-system
  labels:
    app.kubernetes.io/name: production-storage-prep
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: node01
  containers:
    - name: prepare
      image: busybox:1.37
      command: ["sh", "-ec"]
      args:
        - |
          install -d -o 999 -g 999 -m 0750 /host/var/lib/localshops-secondary/backups
          install -d -o 999 -g 999 -m 0750 /host/var/lib/keycloak-secondary/backups
      securityContext:
        allowPrivilegeEscalation: true
        runAsUser: 0
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
