apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshot
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          hostNetwork: true
          nodeSelector:
            kubernetes.io/hostname: master
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: rotate
              image: busybox:1.37
              command: ["sh", "-ec"]
              args:
                - |
                  if [ -f /backups/etcd-current.db ]; then
                    mv -f /backups/etcd-current.db /backups/etcd-previous.db
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backups
                  mountPath: /backups
          containers:
            - name: snapshot
              image: registry.k8s.io/etcd:3.6.5-0
              command:
                - etcdctl
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt
                - --cert=/etc/kubernetes/pki/etcd/client.crt
                - --key=/etc/kubernetes/pki/etcd/client.key
                - snapshot
                - save
                - /backups/etcd-current.db
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 0
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: etcd-certs
              secret:
                secretName: etcd-backup-client
                defaultMode: 0440
            - name: backups
              hostPath:
                path: /var/backups/etcd
                type: Directory
            - name: tmp
              emptyDir: {}
