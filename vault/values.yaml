global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true
  replicas: 2
  logLevel: info
  webhook:
    failurePolicy: Fail
    namespaceSelector:
      matchLabels:
        vault-injection: enabled
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

server:
  enabled: true
  image:
    repository: hashicorp/vault
    tag: 2.0.3
    pullPolicy: IfNotPresent
  logLevel: info
  logFormat: json
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  tolerations: []
  nodeSelector:
    kubernetes.io/hostname: node02
  affinity: ""
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: local-retain
    accessMode: ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    disruptionBudget:
      enabled: true
      maxUnavailable: 0
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}
  service:
    enabled: true
    active:
      enabled: true
    standby:
      enabled: true
    instanceSelector:
      enabled: true

ui:
  enabled: true
  serviceType: ClusterIP
  activeVaultPodOnly: false

csi:
  enabled: false
