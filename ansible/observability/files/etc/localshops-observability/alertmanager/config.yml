global:
  resolve_timeout: 5m

route:
  receiver: local-alerts
  group_by:
    - alertname
    - environment
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-alerts
      matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: local-alerts

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - environment
      - service
