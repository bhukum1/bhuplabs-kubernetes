groups:
  - name: endpoint-availability
    rules:
      - alert: PublicEndpointDown
        expr: probe_success{job="public-endpoints"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Public endpoint is unavailable
          description: "{{ $labels.instance }} has failed external HTTPS probes for more than two minutes."
      - alert: PublicEndpointSlow
        expr: probe_duration_seconds{job="public-endpoints"} > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Public endpoint is slow
          description: "{{ $labels.instance }} has taken more than three seconds for ten minutes."
      - alert: PublicCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="public-endpoints"} - time()) < 14 * 24 * 60 * 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Public TLS certificate expires in under 14 days
          description: "{{ $labels.instance }} needs certificate renewal attention."

  - name: scrape-health
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Monitoring target is down
          description: "{{ $labels.job }} target {{ $labels.instance }} has not been scraped for five minutes."
      - alert: OKECollectorMissing
        expr: absent(up{cluster="localshops-oke"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: OKE telemetry is missing
          description: No OKE metrics have reached VictoriaMetrics for five minutes.

  - name: infrastructure-capacity
    rules:
      - alert: HostCPUHigh
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 90%
          description: "{{ $labels.instance }} has sustained high CPU usage for 15 minutes."
      - alert: HostMemoryHigh
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host memory usage is above 90%
          description: "{{ $labels.instance }} has sustained high memory usage for 15 minutes."
      - alert: HostFilesystemLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint=~"/|/srv/localshops-observability"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint=~"/|/srv/localshops-observability"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Filesystem has less than 15% free space
          description: "{{ $labels.instance }} mount {{ $labels.mountpoint }} is nearly full."
      - alert: HostClockNotSynchronized
        expr: node_timex_sync_status == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Host clock is not synchronized
          description: "{{ $labels.instance }} has reported an unsynchronized system clock for ten minutes."
      - alert: ObservabilityBackupStale
        expr: time() - localshops_observability_backup_last_success_unixtime > 36 * 60 * 60 or absent(localshops_observability_backup_last_success_unixtime)
        for: 15m
        labels:
          severity: critical
          service: observability-backup
        annotations:
          summary: Observability recovery backup is stale
          description: No successful, integrity-checked observability control-data backup has been recorded in 36 hours.

  - name: postgresql
    rules:
      - alert: PostgreSQLExporterDown
        expr: pg_up{job="postgres-exporter"} == 0 or absent(pg_up{job="postgres-exporter"})
        for: 5m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: PostgreSQL monitoring or database is unavailable
          description: PostgreSQL has not produced a successful exporter scrape for five minutes.
      - alert: PostgreSQLTooManyConnections
        expr: sum by (instance, environment, namespace) (pg_stat_activity_count{job="postgres-exporter",datname!=""}) / max by (instance, environment, namespace) (pg_settings_max_connections{job="postgres-exporter"}) > 0.80
        for: 10m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: PostgreSQL connection usage exceeds 80%
          description: PostgreSQL connection capacity has remained high for ten minutes.
      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks{job="postgres-exporter"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: PostgreSQL deadlock detected
          description: "Database {{ $labels.datname }} recorded a deadlock during the last 15 minutes."

  - name: database-recovery
    rules:
      - alert: PostgreSQLBackupStale
        expr: time() - kube_cronjob_status_last_successful_time{namespace="localshops",cronjob="postgres-backup"} > 36 * 60 * 60 or absent(kube_cronjob_status_last_successful_time{namespace="localshops",cronjob="postgres-backup"})
        for: 15m
        labels:
          severity: critical
          service: postgresql-backup
        annotations:
          summary: Production PostgreSQL backup is stale
          description: No successful production database backup has been recorded in the last 36 hours.
      - alert: PostgreSQLRestoreCheckStale
        expr: time() - kube_cronjob_status_last_successful_time{namespace="localshops",cronjob="postgres-restore-check"} > 8 * 24 * 60 * 60 or absent(kube_cronjob_status_last_successful_time{namespace="localshops",cronjob="postgres-restore-check"})
        for: 30m
        labels:
          severity: critical
          service: postgresql-backup
        annotations:
          summary: PostgreSQL restore verification is stale
          description: No successful isolated restore check has been recorded in the last eight days.
      - alert: PostgreSQLRecoveryJobFailed
        expr: kube_job_status_failed{namespace="localshops",job_name=~"postgres-(backup|restore-check)-.+"} > 0
        for: 5m
        labels:
          severity: critical
          service: postgresql-backup
        annotations:
          summary: PostgreSQL recovery job failed
          description: "{{ $labels.namespace }}/{{ $labels.job_name }} has failed."
      - alert: PostgreSQLVolumeLow
        expr: kubelet_volume_stats_available_bytes{namespace=~"localshops(-dev)?",persistentvolumeclaim="postgres-data"} / kubelet_volume_stats_capacity_bytes{namespace=~"localshops(-dev)?",persistentvolumeclaim="postgres-data"} < 0.15
        for: 15m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: PostgreSQL volume has less than 15% free space
          description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is nearing capacity."

  - name: kubernetes-workloads
    rules:
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Kubernetes node is not ready
          description: "OKE node {{ $labels.node }} has been NotReady for five minutes."
      - alert: LocalshopsDeploymentUnavailable
        expr: kube_deployment_status_replicas_available{namespace=~"localshops(-dev)?"} < kube_deployment_spec_replicas{namespace=~"localshops(-dev)?"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Localshops deployment has unavailable replicas
          description: "{{ $labels.namespace }}/{{ $labels.deployment }} is below its desired replica count."
      - alert: PodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Pod is crash-looping
          description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."
      - alert: PodOOMKilled
        expr: increase(kube_pod_container_status_restarts_total{namespace=~"localshops(-dev)?"}[10m]) > 0 and on(namespace,pod,container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Pod container was killed for exceeding memory
          description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled."
      - alert: PodPendingTooLong
        expr: kube_pod_status_phase{namespace=~"localshops(-dev)?",phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod has remained Pending
          description: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for ten minutes."

  - name: redis
    rules:
      - alert: RedisExporterDown
        expr: redis_up{namespace=~"localshops(-dev)?"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Redis is unavailable
          description: "The Redis instance in {{ $labels.namespace }} has been unavailable for five minutes."
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes{namespace=~"localshops(-dev)?"} / clamp_min(redis_memory_max_bytes{namespace=~"localshops(-dev)?"}, 1) > 0.85 and redis_memory_max_bytes{namespace=~"localshops(-dev)?"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis memory usage exceeds 85%
          description: "The Redis instance in {{ $labels.namespace }} is approaching its configured memory limit."

  - name: localshops-api
    rules:
      - alert: LocalshopsAPIHighErrorRate
        expr: sum by (environment) (rate(localshops_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum by (environment) (rate(localshops_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Localshops API 5xx rate exceeds 5%
          description: "The {{ $labels.environment }} API has exceeded a 5% server-error rate for ten minutes."
      - alert: LocalshopsAPIHighLatency
        expr: histogram_quantile(0.95, sum by (le, environment) (rate(localshops_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Localshops API p95 latency exceeds one second
          description: "The {{ $labels.environment }} API has been slow for ten minutes."
