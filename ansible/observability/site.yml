---
- name: Configure the Localshops observability host
  hosts: observability
  become: true
  gather_facts: true
  vars_files:
    - group_vars/observability.yml
  vars:
    observability_services:
      - localshops-victoriametrics
      - localshops-loki
      - localshops-alertmanager
      - localshops-blackbox
      - localshops-node-exporter
      - localshops-vmagent
      - localshops-vmalert
      - localshops-grafana
      - localshops-caddy
    observability_data_directories:
      - {path: victoriametrics, owner: root, group: root}
      - {path: loki, owner: "10001", group: "10001"}
      - {path: alertmanager, owner: "65534", group: "65534"}
      - {path: grafana, owner: "472", group: "472"}
      - {path: caddy/data, owner: root, group: root}
      - {path: caddy/config, owner: root, group: root}
      - {path: containers/storage, owner: root, group: root}

  tasks:
    - name: Install the small host runtime set
      ansible.builtin.dnf:
        name:
          - podman
          - firewalld
          - chrony
          - xfsprogs
          - sqlite
          - dnf-automatic
        state: present

    - name: Keep time synchronization and firewall active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - chronyd
        - firewalld

    - name: Persist SELinux enforcing mode
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=enforcing
        owner: root
        group: root
        mode: "0644"

    - name: Read the current SELinux mode
      ansible.builtin.command:
        argv: [getenforce]
      register: node02_selinux_mode
      changed_when: false

    - name: Enforce SELinux immediately
      ansible.builtin.command:
        argv: [setenforce, "1"]
      when: node02_selinux_mode.stdout != "Enforcing"

    - name: Limit automatic package updates to security advisories
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: '^upgrade_type\s*='
        line: upgrade_type = security

    - name: Enable automatic package installation
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: '^apply_updates\s*='
        line: apply_updates = yes

    - name: Keep automatic reboots disabled
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: '^reboot\s*='
        line: reboot = never

    - name: Enable the daily automatic security-update timer
      ansible.builtin.systemd_service:
        name: dnf-automatic-install.timer
        enabled: true
        state: started

    - name: Stop host services replaced by the Localshops monitoring stack
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pmlogger
        - pmcd
        - rpcbind.socket
        - rpcbind

    - name: Install SSH daemon hardening
      ansible.builtin.copy:
        src: files/etc/ssh/sshd_config.d/00-localshops-hardening.conf
        dest: /etc/ssh/sshd_config.d/00-localshops-hardening.conf
        owner: root
        group: root
        mode: "0600"
      register: node02_sshd_hardening

    - name: Remove the superseded late-order SSH hardening file
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/60-localshops-hardening.conf
        state: absent

    - name: Validate the hardened SSH daemon configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false

    - name: Reload SSH after a validated hardening change
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded
      when: node02_sshd_hardening is changed

    - name: Read the mounted observability filesystem UUID
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - UUID
          - "{{ observability_data_root }}"
      register: observability_mounted_uuid
      changed_when: false

    - name: Refuse to use an unexpected or missing data volume
      ansible.builtin.assert:
        that:
          - observability_mounted_uuid.stdout == observability_volume.filesystem_uuid
        fail_msg: >-
          {{ observability_data_root }} is not the verified observability volume.
          This playbook never formats or replaces an unknown device.

    - name: Create persistent service data directories
      ansible.builtin.file:
        path: "{{ observability_data_root }}/{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0750"
      loop: "{{ observability_data_directories }}"

    - name: Install non-secret observability configuration
      ansible.builtin.copy:
        src: files/etc/localshops-observability/
        dest: /etc/localshops-observability/
        owner: root
        group: root
        directory_mode: "0755"
        mode: "0644"
      notify: Restart observability services

    - name: Install rootful Podman Quadlet units
      ansible.builtin.copy:
        src: files/etc/containers/systemd/
        dest: /etc/containers/systemd/
        owner: root
        group: root
        directory_mode: "0755"
        mode: "0644"
      notify: Restart observability services

    - name: Check for the retired node02 PostgreSQL exporter Quadlet
      ansible.builtin.stat:
        path: /etc/containers/systemd/localshops-postgres-exporter.container
      register: retired_postgres_exporter_quadlet

    - name: Stop the retired node02 PostgreSQL exporter
      ansible.builtin.systemd_service:
        name: localshops-postgres-exporter
        state: stopped
        enabled: false
      when: retired_postgres_exporter_quadlet.stat.exists

    - name: Remove retired node02 PostgreSQL exporter files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containers/systemd/localshops-postgres-exporter.container
        - /etc/localshops-observability/postgres-exporter.env
        - /etc/localshops-observability/postgres-exporter

    - name: Install host backup script
      ansible.builtin.copy:
        src: files/usr/local/sbin/localshops-observability-backup
        dest: /usr/local/sbin/localshops-observability-backup
        owner: root
        group: root
        mode: "0750"

    - name: Create node-exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install backup systemd units
      ansible.builtin.copy:
        src: files/etc/systemd/system/
        dest: /etc/systemd/system/
        owner: root
        group: root
        mode: "0644"

    - name: Check required runtime-only credential files
      ansible.builtin.stat:
        path: "/etc/localshops-observability/{{ item }}"
      register: observability_secret_files
      loop:
        - grafana.env
        - caddy.env
      no_log: true

    - name: Refuse to start without runtime credentials
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0600"
          - item.stat.pw_name == "root"
        fail_msg: >-
          A root-owned 0600 runtime credential is missing. Follow the credential
          bootstrap in README.md; never put it in Git or Ansible inventory.
      loop: "{{ observability_secret_files.results }}"
      no_log: true

    - name: Check Alertmanager SMTP runtime files
      ansible.builtin.stat:
        path: "/etc/localshops-observability/{{ item }}"
      register: alertmanager_smtp_files
      loop:
        - alertmanager-smtp.json
        - alertmanager-smtp-password
      no_log: true

    - name: Refuse to enable email without protected SMTP runtime files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == "root"
          - >-
            (item.item == "alertmanager-smtp.json" and item.stat.mode == "0600")
            or
            (item.item == "alertmanager-smtp-password" and
             item.stat.mode == "0640" and item.stat.gid == 65534)
        fail_msg: >-
          An Alertmanager SMTP runtime file is missing or has unsafe ownership
          or permissions. Follow the bootstrap in README.md; never commit it.
      loop: "{{ alertmanager_smtp_files.results }}"
      no_log: true

    - name: Read non-password Alertmanager SMTP settings
      ansible.builtin.slurp:
        src: /etc/localshops-observability/alertmanager-smtp.json
      register: alertmanager_smtp_document
      no_log: true

    - name: Decode Alertmanager SMTP settings
      ansible.builtin.set_fact:
        alertmanager_smtp: "{{ alertmanager_smtp_document.content | b64decode | from_json }}"
      no_log: true

    - name: Validate Alertmanager SMTP settings
      ansible.builtin.assert:
        that:
          - alertmanager_smtp.smarthost == "smtp.email.ap-hyderabad-1.oci.oraclecloud.com:587"
          - alertmanager_smtp.from is match('^[^@\\s]+@dukly\\.in$')
          - alertmanager_smtp.to is match('^[^@\\s]+@[^@\\s]+$')
          - alertmanager_smtp.auth_username | length > 20
        fail_msg: Alertmanager SMTP settings are invalid.
      no_log: true

    - name: Render the protected Alertmanager notification configuration
      ansible.builtin.template:
        src: alertmanager-config.yml.j2
        dest: /etc/localshops-observability/alertmanager/config.yml
        owner: root
        group: "65534"
        mode: "0640"
      notify: Restart observability services
      no_log: true

    - name: Validate the rendered Alertmanager configuration before restart
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --network=none
          - --entrypoint=/bin/amtool
          - --volume=/etc/localshops-observability/alertmanager/config.yml:/etc/alertmanager/config.yml:ro,Z
          - --volume=/etc/localshops-observability/alertmanager-smtp-password:/etc/alertmanager/smtp-password:ro,Z
          - "{{ observability_images.alertmanager }}"
          - check-config
          - /etc/alertmanager/config.yml
      changed_when: false
      no_log: true

    - name: Check public gateway services in firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - "--query-service={{ item }}"
      register: observability_firewall_queries
      changed_when: false
      failed_when: observability_firewall_queries.rc not in [0, 1]
      loop:
        - http
        - https

    - name: Permit only missing HTTP and HTTPS gateway services
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - "--add-service={{ item.item }}"
      loop: "{{ observability_firewall_queries.results }}"
      when: item.rc == 1
      register: observability_firewall_changes
      changed_when: true

    - name: Activate changed firewall policy
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      when: observability_firewall_changes is changed
      changed_when: true

    - name: Regenerate Quadlet systemd services
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable the validated daily recovery backup
      ansible.builtin.systemd_service:
        name: localshops-observability-backup.timer
        state: started
        enabled: true

    - name: Start and boot-enable the observability stack
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ observability_services }}"

    - name: Wait for local service health endpoints
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
        return_content: false
      register: observability_health
      retries: 30
      delay: 2
      until: observability_health.status == 200
      loop:
        - http://127.0.0.1:3000/api/health
        - http://127.0.0.1:8428/health
        - http://127.0.0.1:8429/health
        - http://127.0.0.1:8880/health
        - http://127.0.0.1:3100/ready
        - http://127.0.0.1:9093/-/ready
        - http://127.0.0.1:9115/-/healthy

  handlers:
    - name: Restart observability services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
      loop: "{{ observability_services }}"
