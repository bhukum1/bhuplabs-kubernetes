deploymentMode: SingleBinary

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_query_length: 72h
    max_query_parallelism: 8
    volume_enabled: true
  compactor:
    working_directory: /var/loki/retention
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 4

singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: node01
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
    storageClass: local-retain
    size: 4Gi
    selector:
      matchLabels:
        bhuplabs.dev/storage: loki

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  dashboards:
    enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kps

networkPolicy:
  enabled: false
