apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: localshops
  labels: &labels
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: bhuplabs-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/oliver006/redis_exporter@sha256:4a669d617fa15533c8bffbf9a7417b7f54fcfb5f9c96d04bccfec6867f6d3780
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: redis://session-redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localshops-runtime
                  key: redis-password
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: localshops
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter
  namespace: localshops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 9121
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: session-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter-to-redis
  namespace: localshops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: session-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-exporter
      ports:
        - protocol: TCP
          port: 6379
---
