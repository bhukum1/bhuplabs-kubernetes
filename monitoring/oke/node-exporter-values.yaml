fullnameOverride: node-exporter

hostNetwork: true

service:
  listenOnAllInterfaces: false

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 120m
    memory: 96Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

serviceMonitor:
  enabled: false

prometheus:
  monitor:
    enabled: false
