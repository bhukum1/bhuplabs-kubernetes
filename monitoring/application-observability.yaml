apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: localshops-api
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    # Production is covered by readiness probes until its metrics-enabled image
    # is released. Add `localshops` after /metrics exists in that deployment.
    matchNames: [localshops-dev]
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: environment
          regex: localshops-dev
          replacement: dev
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-api-metrics
  namespace: localshops-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-blackbox-exporter
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
