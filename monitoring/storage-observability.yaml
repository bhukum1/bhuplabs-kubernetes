apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-local-pv-node02
  labels:
    bhuplabs.dev/storage: prometheus
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-retain
  local:
    path: /var/lib/monitoring/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [node02]
